<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140b1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SUMO TIME — CONTROLLER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/client/shared/pixel.css" />
    <link rel="stylesheet" href="/client/phone/phone.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140b1a'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23ffce54'/%3E%3C/svg%3E"
    />
  </head>
  <body class="phone">
    <header id="phonetop">
      <div class="row" style="gap: 8px">
        <span class="led" id="p-netled"></span>
        <span id="p-title">SUMO TIME</span>
      </div>
      <div class="row" style="gap: 8px">
        <span class="label dim" id="p-room"></span>
        <button class="pixelbtn" style="min-height: 34px; padding: 4px 10px; font-size: 10px" id="p-menu">≡</button>
      </div>
    </header>

    <!-- ============================= JOIN =============================
         Step 1 of three. A phone arrives here straight off the QR code with
         the room already known, so the only thing it asks for is a name. -->
    <main id="p-screen-join" class="pscreen joinscreen">
      <div class="stepline"><span class="stepnum">1</span><span>ENTER THE ROOM</span></div>

      <div class="joincard pixelpanel">
        <!-- Scanned the QR: the room is settled, so it is shown as a fact. -->
        <div class="roomchip" id="roomchip">
          <span class="rclabel">ROOM</span>
          <span class="rccode" id="roomchip-code">----</span>
        </div>

        <!-- Typed in by hand: no QR, so the code has to be asked for. -->
        <div class="joinfield hidden" id="roomfield">
          <label class="label" for="in-room">ROOM CODE ON THE BIG SCREEN</label>
          <input id="in-room" class="pixelinput" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" />
        </div>

        <div class="joinfield">
          <label class="label" for="in-name">YOUR NAME</label>
          <input id="in-name" class="pixelinput big" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CHALLENGER" />
          <div class="fieldhint">UP TO 10 LETTERS — THIS IS WHAT THE RING SHOWS</div>
        </div>

        <button class="pixelbtn on joinbtn" id="btn-join">ENTER ROOM</button>
        <div class="label warntext" id="joinerr"></div>
      </div>
    </main>

    <!-- ============================ LOBBY =============================
         Step 2: pick a side. This is also where a phone with no seat waits,
         so an opening seat is always one tap away. -->
    <main id="p-screen-lobby" class="pscreen hidden">
      <div class="stepline"><span class="stepnum">2</span><span id="lobbystep">CHOOSE YOUR SIDE</span></div>

      <div id="p-seats" class="seatpick"></div>

      <div class="statusbar pixelpanel">
        <span class="led" id="p-statusled"></span>
        <div class="label" id="p-waiting">WAITING FOR THE RING TO START…</div>
      </div>

      <div class="lobbyfoot">
        <button class="pixelbtn" id="btn-backtopad" hidden>◄ BACK TO MY CONTROLS</button>
        <button class="pixelbtn danger" id="btn-leave">LEAVE ROOM</button>
      </div>
    </main>

    <!-- ==================== CHARACTER SELECT + READY ==================
         Step 3: who you are, then READY. -->
    <main id="p-screen-rules" class="pscreen hidden">
      <div class="stepline"><span class="stepnum">3</span><span id="rules-seatline">PICK YOUR WRESTLER</span></div>

      <div class="selectcard pixelpanel">
        <div class="selecttitle" id="rules-goal">PICK YOUR WRESTLER</div>
        <div class="selectrow">
          <div id="skinbig" class="skinbig"></div>
          <div id="skingrid" class="skingrid"></div>
        </div>
        <div class="skinname" id="skinname">MANGO</div>
        <div class="quickrules">TAP A HIT · HOLD A PARRY = 🥭 · B PUSH</div>
      </div>

      <div class="readybar">
        <button class="pixelbtn on" id="btn-ready">READY</button>
        <div class="waitline dim" id="readyline"></div>
      </div>
    </main>

    <!-- ============================= PLAY ============================= -->
    <main id="p-screen-play" class="pscreen hidden">
      <div class="fighthud pixelpanel">
        <div class="hudrow">
          <span class="seatname" id="hud-seatlabel">P1</span>
          <div class="roundpips" id="hud-pips"></div>
          <div class="pixelbar" id="hud-weightbar"><div class="fill"></div><div class="over"></div></div>
          <span class="hudnum" id="hud-weightnum">100</span>
        </div>
        <div class="hudrow">
          <span class="seatname dim" id="hud-opplabel">VS</span>
          <div class="pixelbar opp" id="hud-oppbar"><div class="fill"></div><div class="over"></div></div>
          <span class="hudnum dim" id="hud-oppnum">100</span>
        </div>
        <div class="hudrow spread">
          <div class="row" style="gap: 10px">
            <div class="parrylight"><span class="led" id="hud-parrylight"></span><span>PARRY</span></div>
            <span class="combochip" id="hud-combo">COMBO 0</span>
            <span class="combochip mango" id="hud-mangoes">🥭 0</span>
          </div>
          <span class="label dim" id="hud-clock">0:00</span>
        </div>
        <div class="pushhint" id="hud-pushhint">TAP A TO CHIP THEM</div>
      </div>
      <div id="p-pad" style="display: contents"></div>
    </main>

    <!-- No separate "you are spectating" screen: a phone with no seat waits on
         the seat picker itself, so the moment a seat opens it is one tap away
         instead of behind a menu. -->

    <div id="p-matchflash" class="matchflash hidden"><div class="big" id="p-matchflash-text"></div></div>
    <div id="p-toasts" class="toast-wrap"></div>

    <!-- The controller is a landscape instrument: shown in portrait whenever
         the phone is in fight mode (character select or the pad itself). -->
    <div id="rotatehint" class="rotatehint">
      <div class="rotateinner">
        <div class="rotateicon">⟳</div>
        <div>TURN YOUR PHONE SIDEWAYS</div>
      </div>
    </div>

    <script type="module" src="/client/phone/main.js"></script>
  </body>
</html>
