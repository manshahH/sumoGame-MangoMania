<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140b1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SUMO TIME — CONTROLLER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/client/shared/pixel.css" />
    <link rel="stylesheet" href="/client/phone/phone.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140b1a'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23ffce54'/%3E%3C/svg%3E"
    />
  </head>
  <body class="phone">
    <header id="phonetop">
      <div class="row" style="gap: 8px">
        <span class="led" id="p-netled"></span>
        <span id="p-title">SUMO TIME</span>
      </div>
      <div class="row" style="gap: 8px">
        <span class="label dim" id="p-room"></span>
        <button class="pixelbtn" style="min-height: 34px; padding: 4px 10px; font-size: 10px" id="p-menu">≡</button>
      </div>
    </header>

    <!-- ============================= JOIN ============================= -->
    <main id="p-screen-join" class="pscreen">
      <div class="pixelpanel">
        <div style="padding: 14px" class="col">
          <label class="label" for="in-room">ROOM CODE</label>
          <input id="in-room" class="pixelinput" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" />
          <label class="label" for="in-name" style="margin-top: 8px">YOUR NAME</label>
          <input id="in-name" class="pixelinput" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CHALLENGER" />
          <button class="pixelbtn on" id="btn-join" style="margin-top: 10px">ENTER THE RING</button>
          <div class="label warntext" id="joinerr"></div>
          <p class="label dim" style="line-height: 1.7; margin-top: 6px">
            THE DESKTOP SHOWS THE ROOM CODE AND A QR. SAME WIFI AS THE SCREEN.
          </p>
        </div>
      </div>
    </main>

    <!-- ============================ LOBBY ============================= -->
    <main id="p-screen-lobby" class="pscreen hidden">
      <div class="col" style="gap: 10px">
        <div class="label dim" id="lobbyhint">CLAIM A SEAT. AN OPEN SEAT IS FLOWN BY A BOT.</div>
        <div id="p-seats" class="col" style="gap: 10px"></div>
        <div class="pixelpanel">
          <div style="padding: 12px">
            <div class="label dim" id="p-waiting">WAITING FOR THE RING TO START…</div>
          </div>
        </div>
        <button class="pixelbtn danger" id="btn-leave" style="margin-top: 4px">LEAVE ROOM</button>
      </div>
    </main>

    <!-- ============================= PLAY ============================= -->
    <main id="p-screen-play" class="pscreen hidden">
      <div class="fighthud pixelpanel">
        <div class="hudrow">
          <span class="label" id="hud-seatlabel">P1</span>
          <div class="pixelbar" id="hud-weightbar"><div class="fill"></div></div>
          <span class="hudnum" id="hud-weightnum">100</span>
        </div>
        <div class="hudrow spread">
          <div class="row">
            <div class="parrylight"><span class="led" id="hud-parrylight"></span><span class="label">PARRY</span></div>
            <span class="combochip" id="hud-combo">COMBO 0</span>
          </div>
          <span class="label dim" id="hud-clock">00:00</span>
        </div>
      </div>
      <div id="p-pad"></div>
    </main>

    <!-- ============================= IDLE ============================= -->
    <main id="p-screen-idle" class="pscreen hidden">
      <div class="pixelpanel idlecard">
        <h3 style="margin-bottom: 12px">WAITING</h3>
        <p class="label dim" style="line-height: 1.7">
          THE RING IS TAKEN. UNCLAIMED SEATS ARE FLOWN BY A BOT.<br />WAIT FOR THE MATCH TO END,
          THEN CLAIM A SEAT.
        </p>
      </div>
    </main>

    <div id="p-matchflash" class="matchflash hidden"><div class="big" id="p-matchflash-text"></div></div>
    <div id="p-toasts" class="toast-wrap"></div>

    <script type="module" src="/client/phone/main.js"></script>
  </body>
</html>
