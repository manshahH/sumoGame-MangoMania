<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SUMO TIME — RING</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/client/shared/pixel.css" />
    <link rel="stylesheet" href="/client/desktop/desktop.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140b1a'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23ffce54'/%3E%3C/svg%3E"
    />
  </head>
  <body class="desktop">
    <!-- ============================= LOBBY ============================ -->
    <main id="screen-lobby" class="screenview">
      <header class="lobbyhead">
        <div>
          <h1 id="brand">SUMO TIME</h1>
          <div class="label dim">PIXEL SUMO ARCADE · MANGO MANIA</div>
        </div>
        <div class="row" style="gap: 8px">
          <div class="statuschip"><span class="led" id="netled"></span><span id="nettext">LINKING</span></div>
          <button class="pixelbtn small" id="btn-sound">SND ON</button>
          <button class="pixelbtn small" id="btn-debug">DBG</button>
        </div>
      </header>

      <div class="lobbygrid">
        <!-- the hero: everything a stranger walking up needs -->
        <section class="pixelpanel joinpanel">
          <div class="panel-title">SCAN TO PLAY</div>
          <div class="panel-body joinbody">
            <div class="label dim">ROOM CODE</div>
            <div id="roomcode" class="roomcode">----</div>
            <div id="qrbox" class="qrbox"></div>
            <div id="joinurl" class="joinurl">connecting…</div>
            <div class="label dim" id="lan-note"></div>
          </div>
        </section>

        <section class="lobbyright">
          <div class="seatcards" id="seatcards"></div>

          <div class="pixelpanel">
            <div class="panel-title">BOT DIFFICULTY</div>
            <div class="panel-body">
              <div class="tierrow" id="tierrow"></div>
              <p class="hint">Applies to any seat a phone hasn’t claimed.</p>
            </div>
          </div>

          <div class="pixelpanel champpanel">
            <div class="panel-title">MANGO MANIA LEADERBOARD</div>
            <div class="panel-body" id="champbody"></div>
          </div>

          <button class="pixelbtn on bigbtn startbtn" id="btn-start">▶ START MATCH · BEST OF 3</button>
          <p class="hint center" id="startnote"></p>
        </section>
      </div>
    </main>

    <!-- ============================= FIGHT ============================= -->
    <main id="screen-fight" class="screenview hidden">
      <canvas id="fightcanvas"></canvas>

      <button class="pixelbtn small quitbtn" id="btn-lobby">◄ LOBBY</button>

      <!-- match result, an HTML overlay so the buttons are real buttons -->
      <div id="resultcard" class="resultcard hidden">
        <div class="pixelpanel resultinner">
          <div class="resulttitle" id="result-title">P1 WINS</div>
          <div class="resultscore" id="result-score">2 — 0</div>
          <div class="label" id="result-streak"></div>
          <div class="label dim" id="result-next"></div>
          <div class="resultbtns">
            <button class="pixelbtn on bigbtn" id="btn-again">▶ PLAY AGAIN</button>
            <button class="pixelbtn bigbtn" id="btn-result-lobby">LOBBY</button>
          </div>
        </div>
      </div>
    </main>

    <aside id="debug" class="debugpane pixelpanel hidden">
      <div class="panel-title">DEBUG</div>
      <div class="panel-body"><pre id="debugtext"></pre></div>
    </aside>

    <script type="module" src="/client/desktop/main.js"></script>
  </body>
</html>
